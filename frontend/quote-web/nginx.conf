# Configurazione nginx per il frontend in container.
#
# nginx fa due mestieri qui, ed è lo stesso schema usato da poste-fastquote:
#   1. serve i file statici prodotti dalla build Vue
#   2. fa da reverse proxy verso i servizi, così il browser vede una sola
#      origine e non ci sono problemi di CORS

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressione: i bundle JavaScript sono testo e si comprimono molto bene.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Endpoint per le probe di Kubernetes.
    # Deve rispondere senza toccare i backend: dice se NGINX è vivo, non
    # se l'intera applicazione funziona.
    location = /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"UP"}';
    }

    # I nomi catalog-service e quote-service sono risolti dal DNS interno:
    # in Kubernetes dal Service, in docker-compose dal nome del servizio.
    # È il motivo per cui non serve conoscere gli indirizzi IP.
    location /api/garanzie {
        proxy_pass http://catalog-service:8080/api/v1/garanzie;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/preventivi {
        proxy_pass http://quote-service:8080/api/v1/preventivi;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # I file con hash nel nome (app.4f3a2b.js) non cambiano mai contenuto:
    # si possono mettere in cache per sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fondamentale per una single page application.
    #
    # L'applicazione ha un solo file HTML: qualunque URL il browser chieda,
    # va restituito index.html e poi è il JavaScript a decidere cosa mostrare.
    # Senza questa riga, ricaricare la pagina su un percorso interno darebbe 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
