# Ambiente locale senza Kubernetes.
#
# Serve a due cose:
#   - avere tutto in piedi con un comando mentre si sviluppa
#   - capire cosa fa Kubernetes, vedendo prima la versione semplice
#
# La corrispondenza fra i due mondi è quasi uno a uno:
#
#   docker-compose            Kubernetes
#   ----------------------    -----------------------------------------
#   service                   Deployment + Service
#   nome del servizio         nome DNS del Service
#   environment               ConfigMap / Secret
#   ports                     Gateway (o port-forward)
#   healthcheck               liveness / readiness probe
#   depends_on                nessun equivalente: in Kubernetes l'ordine di
#                             avvio non è garantito, i servizi devono
#                             sopportare che le dipendenze non ci siano ancora
#
# Quell'ultima riga è la differenza concettuale più importante: qui possiamo
# dire "parti dopo il catalogo", in Kubernetes no. Per questo quote-service
# non fallisce all'avvio se il catalogo non risponde: si limita a dichiararsi
# non pronto finché non lo raggiunge.

services:
  catalog-service:
    build:
      context: ./services/catalog-service
    image: vue-go/catalog-service:0.1.0
    environment:
      - PORT=8080
    ports:
      # La sintassi con i due punti e il trattino prende il valore
      # dall'ambiente (o da un file .env) e altrimenti usa il default.
      # Serve perche' le porte dell'host sono una risorsa condivisa: se la
      # 8081 e' gia' occupata da qualcos'altro basta esportare CATALOG_PORT,
      # senza modificare questo file. La porta nel container resta 8080.
      #
      # Nota: compose sostituisce le variabili in TUTTO il file, commenti
      # compresi. Scrivere qui un esempio con il dollaro e le graffe fa
      # comparire un warning "variable is not set" a ogni avvio.
      - "${CATALOG_PORT:-8081}:8080"
    # Nessun healthcheck qui, ed è una scelta consapevole.
    #
    # L'immagine distroless non ha shell né curl, quindi il classico
    # `test: ["CMD", "curl", "-f", "http://localhost:8080/health/liveness"]`
    # non può funzionare: dentro il container non esiste curl.
    #
    # Le alternative sono tre: usare un'immagine base più grassa (alpine),
    # aggiungere al binario un flag tipo `--healthcheck` che chiama se stesso,
    # oppure rinunciare all'healthcheck in compose. Qui si rinuncia, perché
    # in Kubernetes le probe le esegue il kubelet dall'esterno e il problema
    # non si pone: vedi le probe nel chart Helm.
    #
    # È un limite reale delle immagini distroless: vale la pena conoscerlo
    # invece di scoprirlo in produzione.

  quote-service:
    build:
      context: ./services/quote-service
    image: vue-go/quote-service:0.1.0
    environment:
      - PORT=8080
      # Il nome "catalog-service" viene risolto dalla rete di compose,
      # esattamente come in Kubernetes lo risolve il Service.
      - CATALOG_URL=http://catalog-service:8080
    ports:
      - "${QUOTE_PORT:-8080}:8080"
    depends_on:
      - catalog-service

  quote-web:
    build:
      context: ./frontend/quote-web
    image: vue-go/quote-web:0.1.0
    ports:
      - "${WEB_PORT:-3010}:8080"
    depends_on:
      - catalog-service
      - quote-service

  # ---------------------------------------------------------------------
  # Micro-frontend: la stessa applicazione, composta invece che monolitica.
  #
  # quote-web (sopra) e' una SPA sola che fa tutto.
  # Qui sotto la stessa cosa e' spezzata in due step indipendenti, ognuno
  # un servizio a se', ricomposti a runtime dall'aggregator.
  #
  # Girano insieme e in parallelo: sono due modi diversi di fare la stessa
  # cosa, ed e' istruttivo confrontarli aperti nello stesso momento.
  # ---------------------------------------------------------------------

  dati-step-fe:
    build:
      context: ./frontend/steps/dati-step-fe
    image: vue-go/dati-step-fe:0.1.0
    environment:
      - PORT=3031
      - STEP_ID=dati
      - ID_VIEW_WEB=dati-step_web
      - ID_VIEW_MOBILE=dati-step_mobile
    ports:
      - "${DATI_STEP_PORT:-3031}:3031"

  garanzie-step-fe:
    build:
      context: ./frontend/steps/garanzie-step-fe
    image: vue-go/garanzie-step-fe:0.1.0
    environment:
      - PORT=3032
      - STEP_ID=garanzie
      - ID_VIEW_WEB=garanzie-step_web
      - ID_VIEW_MOBILE=garanzie-step_mobile
    ports:
      - "${GARANZIE_STEP_PORT:-3032}:3032"

  aggregator:
    build:
      context: ./frontend/aggregator
      args:
        # Deve coincidere con ROUTER_BASE fra le environment qui sotto:
        # uno serve alla build, l'altro al runtime.
        ROUTER_BASE: /funnel/
    image: vue-go/aggregator:0.1.0
    environment:
      - PORT=8080
      # Gli step sono raggiunti dal SERVER per nome di servizio: e' Nuxt a
      # chiamarli in asyncData, non il browser.
      - DATI_STEP_URL=http://dati-step-fe:3031
      - GARANZIE_STEP_URL=http://garanzie-step-fe:3032
      # I servizi Go invece sono raggiunti dal BROWSER, passando dal proxy
      # dell'aggregator: percorso /api/... riscritto verso questi target.
      - CATALOG_URL=http://catalog-service:8080
      - QUOTE_URL=http://quote-service:8080
      # Dietro il gateway l'app vive sotto /funnel, non sulla radice.
      - ROUTER_BASE=/funnel/
    ports:
      - "${AGGREGATOR_PORT:-3001}:8080"
    depends_on:
      - dati-step-fe
      - garanzie-step-fe
      - catalog-service
      - quote-service

  # ---------------------------------------------------------------------
  # Gateway: un solo punto d'ingresso per tutto.
  #
  # Senza, per confrontare le due varianti bisognerebbe saltare fra porte
  # diverse. Con, si apre un indirizzo solo:
  #
  #     http://localhost:3000           la SPA
  #     http://localhost:3000/funnel    i micro-frontend composti
  #
  # Le rotte sono le stesse dichiarate nell'HTTPRoute del chart Helm: quello
  # che provi in locale e' quello che gira nel cluster.
  # ---------------------------------------------------------------------

  gateway:
    image: nginx:1.25-alpine
    volumes:
      - ./infrastructure/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${GATEWAY_PORT:-3000}:8080"
    depends_on:
      - quote-web
      - aggregator
      - catalog-service
      - quote-service

# Una rete sola, creata da compose: tutti i servizi si vedono per nome.
# Se servisse isolare (per esempio impedire al frontend di parlare
# direttamente con il catalogo) si dichiarerebbero reti separate, come fa
# lo scaffolding di Poste con `internal: true`.
