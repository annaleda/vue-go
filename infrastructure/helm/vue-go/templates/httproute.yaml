{{- if .Values.gateway.enabled }}
{{/*
  Le regole di instradamento.

  Un'unica HTTPRoute con più regole: il gateway le valuta e manda la
  richiesta al servizio giusto. Le regole più specifiche vanno per prime,
  perché /api/garanzie e / matcherebbero entrambe una richiesta a
  /api/garanzie, e vince quella dichiarata prima.

  Il filtro URLRewrite è la parte interessante: il percorso pubblico
  (/api/garanzie) resta stabile per chi lo consuma, mentre quello interno
  (/api/v1/garanzie) può cambiare versione senza rompere nessuno. È uno dei
  motivi principali per cui si mette un gateway davanti ai servizi.
*/}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vue-go-route
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/part-of: vue-go
    app.kubernetes.io/managed-by: Helm
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
  {{- if .Values.gateway.hostname }}
  hostnames:
    - {{ .Values.gateway.hostname | quote }}
  {{- end }}
  rules:
    {{- range .Values.routes }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ .path | quote }}
      {{- if .rewrite }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: {{ .rewrite | quote }}
      {{- end }}
      backendRefs:
        - name: {{ .service }}
          port: {{ .port }}
    {{- end }}
{{- end }}
