# Gateway locale: un solo punto d'ingresso per tutto lo stack.
#
# Fa in docker-compose lo stesso mestiere che l'HTTPRoute fa su Kubernetes.
# Le rotte sono deliberatamente IDENTICHE a quelle in values.yaml del chart,
# così quello che provi in locale è quello che gira nel cluster.
#
# L'ordine conta: nginx sceglie la location più specifica, ma i prefissi
# vanno comunque dichiarati prima del catch-all per chiarezza.

server {
    listen 8080;
    server_name _;

    # --- API: riscritte verso i servizi Go ---
    # Il percorso pubblico (/api/garanzie) resta stabile mentre quello
    # interno (/api/v1/garanzie) può cambiare versione.
    location /api/garanzie {
        proxy_pass http://catalog-service:8080/api/v1/garanzie;
        proxy_set_header Host $host;
    }

    location /api/preventivi {
        proxy_pass http://quote-service:8080/api/v1/preventivi;
        proxy_set_header Host $host;
    }

    # --- Bundle di hydration dei micro-frontend ---
    # Il browser li chiede a /dati/web_client.js e /garanzie/web_client.js:
    # sono gli URL che ogni step dichiara in returnMeta.src.
    location /dati {
        proxy_pass http://dati-step-fe:3031;
        proxy_set_header Host $host;
    }

    location /garanzie {
        proxy_pass http://garanzie-step-fe:3032;
        proxy_set_header Host $host;
    }

    # --- La variante a micro-frontend ---
    # Niente slash finale in proxy_pass: il percorso /funnel arriva intatto
    # all'aggregator, che è configurato con router.base = '/funnel/'.
    location /funnel {
        proxy_pass http://aggregator:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- La variante SPA, sulla radice ---
    location / {
        proxy_pass http://quote-web:8080;
        proxy_set_header Host $host;
    }
}
